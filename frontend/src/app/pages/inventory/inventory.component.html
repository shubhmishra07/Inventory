<div class="page-container">
  <div class="header">
    <h2>Inventory Management</h2>
    <button class="btn-primary">Add Inventory</button>
  </div>
  
  <div class="card">
    <div *ngIf="items.length === 0" class="empty-state">
      <p>No inventory records found.</p>
    </div>
    
    <table *ngIf="items.length > 0" class="data-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Details</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of items">
          <td>{{ item.id }}</td>
          <td>{{ item | json }}</td>
          <td>
            <button class="btn-icon text-blue">Edit</button>
            <button class="btn-icon text-red">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
